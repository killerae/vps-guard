name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py --check-manifest .
      - run: bash -n install.sh
      - run: bash -n bootstrap.sh
      - run: sh -n bin/vps-guard
      - name: Verify public pinned download without credentials
        if: github.event.repository.private == false
        run: bash bootstrap.sh --download-only "$RUNNER_TEMP/vps-guard-verified"
